{% set version = "2.5.6" %}

package:
  name: simpleitk
  version: {{ version }}

source:
  url: https://github.com/SimpleITK/SimpleITK/releases/download/v{{ version }}/SimpleITK-{{ version }}.tar.gz
  sha256: 3ae22fbab7f3a9774d3fb6685c01077679f6d09b7a320394905ac71594b7afbc

build:
  number: 1

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cmake   >=3.16.3
    - ninja
    - swig    4.3.*
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}


  host:
    - python
    - swig-abi
    - pip
    - setuptools                             # [py >= 313]
    - libsimpleitk ={{ version }}
    - libitk-devel

  run:
    - python

test:
  imports:
    - SimpleITK
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://www.simpleitk.org
  license: Apache-2.0
  license_file: LICENSE
  summary: Simplified interface to the Insight Toolkit for image registration and segmentation

extra:
  recipe-maintainers:
    - blowekamp
    - zivy
