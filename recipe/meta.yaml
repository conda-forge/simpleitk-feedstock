{% set version = "2.5.7" %}

package:
  name: simpleitk
  version: {{ version }}

source:
  url: https://github.com/SimpleITK/SimpleITK/releases/download/v{{ version }}/SimpleITK-{{ version }}.tar.gz
  sha256: 7f0fe86c49a9bf7caf66d44d5a62c4fe579dccda2177de56f223677dd0f41d31

build:
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cmake   >=3.30
    - ninja
    - swig    >=4.4.0
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}


  host:
    - python
    - swig-abi
    - pip
    - setuptools                             # [py >= 313]
    - libsimpleitk ={{ version }}
    - libitk-devel

  run:
    - python

test:
  imports:
    - SimpleITK
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://www.simpleitk.org
  license: Apache-2.0
  license_file: LICENSE
  summary: Simplified interface to the Insight Toolkit for image registration and segmentation

extra:
  recipe-maintainers:
    - blowekamp
    - zivy
